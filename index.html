<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix copy</title>

  <!-- set theme before paint (defaults to dark) -->
  <script>
    (function () {
      try {
        document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ambient background -->
  <div class="ambient" aria-hidden="true">
    <span class="glow glow-1"></span>
    <span class="glow glow-2"></span>
    <span class="glow glow-3"></span>
    <span class="grid"></span>
  </div>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light or dark mode">
    <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
    </svg>
  </button>

  <main class="card-wrap" id="cardWrap">
    <section class="card" id="card">
      <div class="spotlight"></div>

      <!-- logo (change the letter to whatever you want) -->
      <div class="logo">N</div>

      <!-- ================= LOGIN VIEW ================= -->
      <div class="view" id="loginView">
        <h1>Sign in</h1>
        <p class="subtitle">Watch anything, anytime</p>

        <form id="loginForm" novalidate>
          <div class="group">
            <label class="label" for="email">Email</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"/>
                <path d="M22 7l-10 6L2 7"/>
              </svg>
              <input type="email" id="email" placeholder="you@email.com" autocomplete="email" />
            </div>
            <p class="error" id="emailError"></p>
          </div>

          <div class="group">
            <label class="label" for="password">Password</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="3"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
              <button type="button" class="eye" data-target="password" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="error" id="passwordError"></p>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" id="remember" />
              <span>Remember me</span>
            </label>
            <a href="#" class="link">Forgot password?</a>
          </div>

          <button type="submit" class="btn" id="loginBtn">
            <span class="btn-text">Sign in</span>
            <span class="spinner"></span>
          </button>
        </form>

        <p class="bottom">
          Don't have an account?
          <button type="button" class="link strong linkbtn" id="showRegister">Create one</button>
        </p>
      </div>

      <!-- ================= REGISTER VIEW ================= -->
      <div class="view hidden" id="registerView">
        <h1>Create account</h1>
        <p class="subtitle">Start watching in a minute</p>

        <form id="registerForm" novalidate>
          <div class="group">
            <label class="label" for="regName">Full name</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
              </svg>
              <input type="text" id="regName" placeholder="JohnEzra" autocomplete="name" />
            </div>
            <p class="error" id="regNameError"></p>
          </div>

          <div class="group">
            <label class="label" for="regEmail">Email</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3"/>
                <path d="M22 7l-10 6L2 7"/>
              </svg>
              <input type="email" id="regEmail" placeholder="you@email.com" autocomplete="email" />
            </div>
            <p class="error" id="regEmailError"></p>
          </div>

          <div class="group">
            <label class="label" for="regPassword">Password</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="3"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input type="password" id="regPassword" placeholder="At least 8 characters" autocomplete="new-password" />
              <button type="button" class="eye" data-target="regPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <!-- password strength -->
            <div class="strength" id="strength" data-level="0">
              <div class="bars"><span></span><span></span><span></span><span></span></div>
              <small id="strengthLabel"></small>
            </div>
            <p class="error" id="regPasswordError"></p>
          </div>

          <div class="group">
            <label class="label" for="regConfirm">Confirm password</label>
            <div class="field">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>
                <path d="M9 12l2 2 4-4"/>
              </svg>
              <input type="password" id="regConfirm" placeholder="Re-enter your password" autocomplete="new-password" />
              <button type="button" class="eye" data-target="regConfirm" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="error" id="regConfirmError"></p>
          </div>

          <label class="remember terms">
            <input type="checkbox" id="terms" />
            <span>I agree to the <a href="#" class="link">Terms</a> and <a href="#" class="link">Privacy Policy</a></span>
          </label>
          <p class="error" id="termsError"></p>

          <button type="submit" class="btn" id="registerBtn">
            <span class="btn-text">Create account</span>
            <span class="spinner"></span>
          </button>
        </form>

        <p class="bottom">
          Already have an account?
          <button type="button" class="link strong linkbtn" id="showLogin">Sign in</button>
        </p>
      </div>

      <!-- ================= SUCCESS VIEW ================= -->
      <div class="view hidden success" id="successView">
        <div class="check">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h1>Account created</h1>
        <p class="subtitle" id="successText">You can now sign in.</p>
        <button type="button" class="btn" id="goLogin">
          <span class="btn-text">Continue to sign in</span>
        </button>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
